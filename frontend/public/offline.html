<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050816" />
    <title>ไม่มีการเชื่อมต่อ | IT-SYSTEM</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        font-family: "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
        color: #e6ecff;
        background: radial-gradient(60rem 40rem at 20% 10%, #1e2a5a 0%, transparent 60%), #050816;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 28px;
        text-align: center;
        border-radius: 24px;
        background: rgb(255 255 255 / 0.04);
        box-shadow: 0 0 0 1px rgb(148 163 255 / 0.15) inset;
      }
      /* ไอคอนฝังในหน้า (SVG) — ตอน offline โหลดไฟล์รูปจากเซิร์ฟเวอร์ไม่ได้ */
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        color: #c4b5fd;
        background: rgb(139 92 246 / 0.15);
        box-shadow: 0 0 0 1px rgb(139 92 246 / 0.3) inset;
      }
      h1 { margin: 20px 0 8px; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0; color: #9aa6c8; font-size: 0.95rem; line-height: 1.6; }
      button {
        margin-top: 24px;
        padding: 10px 22px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: linear-gradient(135deg, #22d3ee, #8b5cf6);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="icon" aria-hidden="true">
        <!-- wifi ขีดฆ่า = offline -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
          <path d="M10.7 5.1A15 15 0 0 1 22 8.8" />
          <path d="M5 12.5a10 10 0 0 1 5.2-2.4" />
          <path d="M16.9 10.9A10 10 0 0 1 19 12.5" />
          <path d="M8.5 16a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
          <path d="M3 3l18 18" />
        </svg>
      </span>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>IT-SYSTEM ต้องเชื่อมต่อเครือข่ายเพื่อแสดงข้อมูลล่าสุด<br />ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง</p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
