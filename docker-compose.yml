name: it-system

services:
  # ฐานข้อมูลหลัก — MySQL 8.4 LTS
  # utf8mb4_0900_as_ci = ไม่สนตัวพิมพ์เล็ก-ใหญ่ แต่แยกวรรณยุกต์/สระไทย (ai_ci จะถือว่า "ขาย" = "ข่าย")
  # ครั้งแรกที่สร้าง volume: docker/mysql/init.sh สร้างฐาน it_system_test / it_system_shadow ให้ it_app
  mysql:
    image: mysql:8.4
    container_name: it_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${IT_DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: it_system
      MYSQL_USER: it_app
      MYSQL_PASSWORD: ${IT_DB_PASSWORD:-change_me_strong_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3308:3306" # 3307 = MariaDB เดิม (profile legacy-mariadb)
    volumes:
      - it_mysql:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ฐานเดิม (PostgreSQL 17) — เก็บไว้เป็นสำรองหลังย้ายไป MySQL ไม่ได้เปิดตามปกติ
  # เปิดดูข้อมูลเดิม: docker compose --profile legacy-postgres up -d postgres
  postgres:
    image: postgres:17-alpine
    container_name: it_postgres
    restart: unless-stopped
    profiles: ["legacy-postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IT_DB_ROOT_PASSWORD:-root_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und --locale=C.UTF-8"
      IT_DB_PASSWORD: ${IT_DB_PASSWORD:-change_me_strong_password}
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432" # เผื่อเครื่องมี PostgreSQL อื่นใช้ 5432
    volumes:
      - it_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_system"]
      interval: 5s
      timeout: 5s
      retries: 20

  # REST API (Express.js) — ค่าทั้งหมดจาก express/.env
  # ไฟล์แนบ/ลายเซ็น/ไฟล์ license เก็บที่ ./storage/private (ไม่ขึ้น git — สำรองแยก)
  # โครงสร้างฐานข้อมูล: Prisma migrations (express/prisma) — docker compose exec express npx prisma migrate deploy
  express:
    build: ./express
    container_name: it_express
    restart: unless-stopped
    # ไฟล์เดิมใน bind mount เป็นของ root — ต้องเขียนโฟลเดอร์เดียวกันได้
    user: root
    env_file:
      - ./express/.env
    environment:
      # ค่าที่ต่างจากตอนรันบนเครื่อง (express/.env ชี้ 127.0.0.1:3308)
      DB_HOST: mysql
      DB_PORT: "3306"
      PORT: "8020"
      FILES_ROOT: /data/private
      SKIP_ENV_FILES: "1"
      # งานแจ้งเตือนใกล้หมดอายุ 08:00 (Asia/Bangkok)
      SCHEDULER_ENABLED: "true"
    volumes:
      - ./storage/private:/data/private
    ports:
      - "127.0.0.1:8020:8020"
    depends_on:
      mysql:
        condition: service_healthy

  # จัดการฐานข้อมูลผ่านเว็บ
  # login: ระบบ MySQL, เซิร์ฟเวอร์ mysql, ผู้ใช้ it_app (หรือ root), ฐาน it_system
  adminer:
    image: adminer:5
    container_name: it_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8081:8080" # bind เฉพาะ localhost
    depends_on:
      mysql:
        condition: service_healthy

  # ฐานเดิม (MariaDB) — เก็บไว้เป็นสำรองหลังย้ายไป PostgreSQL ไม่ได้เปิดตามปกติ
  # เปิดดูข้อมูลเดิม: docker compose --profile legacy-mariadb up -d mariadb
  mariadb:
    image: mariadb:11.4
    container_name: it_mariadb
    restart: unless-stopped
    profiles: ["legacy-mariadb"]
    environment:
      MARIADB_ROOT_PASSWORD: ${IT_DB_ROOT_PASSWORD:-root_change_me}
      MARIADB_DATABASE: it_system
      MARIADB_USER: it_app
      MARIADB_PASSWORD: ${IT_DB_PASSWORD:-change_me_strong_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - it_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  it_mysql:
  it_pg: # ข้อมูล PostgreSQL เดิม (สำรอง)
  it_db: # ข้อมูล MariaDB เดิม (สำรอง)
